<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Carte 1200×1200</title>
  <style>
    body{ margin:0; font-family:system-ui, Arial; background:#f6f8fb; }
    .wrap{ max-width:1200px; margin:0 auto; padding:18px; }
    .bar{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .chip{ background:#fff; border:1px solid #e5e7eb; border-radius:12px; padding:10px 12px; font-weight:700; }
    canvas{
      width:100%;
      height:720px;
      display:block;
      background:#ffffff;
      border:1px solid #e5e7eb;
      border-radius:16px;
      margin-top:14px;
      cursor:grab;
    }
    .hint{ margin-top:10px; color:#6b7280; font-size:13px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="bar">
      <div class="chip">Carte 1200×1200</div>
      <div class="chip" id="coord">Survol : </div>
      <div class="chip">Château : centre 597:597</div>
      <div class="chip">Empreinte : 594:594 → 604:604</div>
    </div>

    <canvas id="map"></canvas>
    <div class="hint">Molette = zoom au pointeur. Cliquer glisser = déplacer. Survol = coordonnées.</div>
  </div>

<script>
  var canvas = document.getElementById("map");
  var ctx = canvas.getContext("2d");
  var coordEl = document.getElementById("coord");

  var MAP_W = 1200;
  var MAP_H = 1200;
  var MAX_Y = 1199;

  var tileSize = 24;
  var zoom = 1;
  var MIN_ZOOM = 0.25;
  var MAX_ZOOM = 6;

  var panX = 0;
  var panY = 0;

  var dragging = false;
  var lastX = 0;
  var lastY = 0;

  var CASTLE_CENTER = { x:597, y:597 };
  var CASTLE_FOOTPRINT = { x1:594, y1:594, x2:604, y2:604 };

  var castleImg = new Image();
  var castleReady = false;
  castleImg.onload = function(){ castleReady = true; draw(); };
  castleImg.onerror = function(){ castleReady = false; draw(); };
  castleImg.src = "images/castle.png";

  function resizeCanvas(){
    canvas.width = Math.floor(canvas.getBoundingClientRect().width);
    canvas.height = 720;
  }

  function worldToScreen(x, y){
    var sx = panX + x * tileSize * zoom;
    var sy = panY + (MAX_Y - y) * tileSize * zoom;
    return { x:sx, y:sy };
  }

  function screenToWorld(sx, sy){
    var wx = (sx - panX) / (tileSize * zoom);
    var wy = (sy - panY) / (tileSize * zoom);
    var x = Math.floor(wx);
    var y = MAX_Y - Math.floor(wy);
    return { x:x, y:y };
  }

  function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }

  function centerOn(x, y){
    var sx = canvas.width/2;
    var sy = canvas.height/2;
    panX = sx - x * tileSize * zoom;
    panY = sy - (MAX_Y - y) * tileSize * zoom;
  }

  function init(){
    resizeCanvas();
    centerOn(CASTLE_CENTER.x, CASTLE_CENTER.y);
    draw();
  }

  function drawGrid(){
    ctx.save();

    var ts = tileSize * zoom;

    var x0 = Math.floor((-panX) / ts) - 1;
    var y0 = Math.floor((-panY) / ts) - 1;
    var x1 = Math.floor((canvas.width - panX) / ts) + 1;
    var y1 = Math.floor((canvas.height - panY) / ts) + 1;

    x0 = clamp(x0, 0, MAP_W-1);
    x1 = clamp(x1, 0, MAP_W-1);
    y0 = clamp(y0, 0, MAP_H-1);
    y1 = clamp(y1, 0, MAP_H-1);

    ctx.strokeStyle = "rgba(31,41,55,0.10)";
    ctx.lineWidth = 1;

    for(var x=x0; x<=x1; x++){
      var sx = panX + x * ts;
      ctx.beginPath();
      ctx.moveTo(sx, 0);
      ctx.lineTo(sx, canvas.height);
      ctx.stroke();
    }

    for(var yy=y0; yy<=y1; yy++){
      var sy = panY + yy * ts;
      ctx.beginPath();
      ctx.moveTo(0, sy);
      ctx.lineTo(canvas.width, sy);
      ctx.stroke();
    }

    ctx.restore();
  }

  function drawCastleFootprint(){
    var x1 = CASTLE_FOOTPRINT.x1;
    var y1 = CASTLE_FOOTPRINT.y1;
    var x2 = CASTLE_FOOTPRINT.x2;
    var y2 = CASTLE_FOOTPRINT.y2;

    var ts = tileSize * zoom;

    var topLeft = worldToScreen(x1, y2);
    var w = (x2 - x1 + 1) * ts;
    var h = (y2 - y1 + 1) * ts;

    if(castleReady){
      ctx.save();
      ctx.globalAlpha = 0.98;
      ctx.drawImage(castleImg, topLeft.x, topLeft.y, w, h);
      ctx.restore();
    }else{
      ctx.save();
      ctx.fillStyle = "rgba(245,158,11,0.20)";
      ctx.fillRect(topLeft.x, topLeft.y, w, h);
      ctx.restore();
    }

    ctx.save();
    ctx.strokeStyle = "rgba(239,68,68,0.75)";
    ctx.lineWidth = 2;
    ctx.strokeRect(topLeft.x, topLeft.y, w, h);
    ctx.restore();
  }

  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    drawGrid();
    drawCastleFootprint();
  }

  canvas.addEventListener("wheel", function(e){
    e.preventDefault();

    var rect = canvas.getBoundingClientRect();
    var mx = e.clientX - rect.left;
    var my = e.clientY - rect.top;

    var oldZoom = zoom;
    var factor = e.deltaY < 0 ? 1.15 : 0.87;
    var next = clamp(zoom * factor, MIN_ZOOM, MAX_ZOOM);
    if(next === zoom) return;

    var worldX = (mx - panX) / (tileSize * oldZoom);
    var worldY = (my - panY) / (tileSize * oldZoom);

    zoom = next;

    panX = mx - worldX * tileSize * zoom;
    panY = my - worldY * tileSize * zoom;

    draw();
  }, { passive:false });

  canvas.addEventListener("mousedown", function(e){
    dragging = true;
    lastX = e.clientX;
    lastY = e.clientY;
    canvas.style.cursor = "grabbing";
  });

  window.addEventListener("mouseup", function(){
    dragging = false;
    canvas.style.cursor = "grab";
  });

  window.addEventListener("mousemove", function(e){
    if(!dragging) return;
    panX += (e.clientX - lastX);
    panY += (e.clientY - lastY);
    lastX = e.clientX;
    lastY = e.clientY;
    draw();
  });

  canvas.addEventListener("mousemove", function(e){
    var rect = canvas.getBoundingClientRect();
    var mx = e.clientX - rect.left;
    var my = e.clientY - rect.top;
    var w = screenToWorld(mx, my);

    if(w.x >= 0 && w.x < MAP_W && w.y >= 0 && w.y < MAP_H){
      coordEl.textContent = "Survol : " + w.x + ":" + w.y;
    }else{
      coordEl.textContent = "Survol : ";
    }
  });

  window.addEventListener("resize", function(){
    resizeCanvas();
    draw();
  });

  init();
</script>
</body>
</html>
