<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Carte • Kingdom 340</title>
<link rel="stylesheet" href="css/styles.css" />
<style>
  .mapWrapper{
    margin-top:20px;
    border:1px solid var(--line);
    border-radius:14px;
    overflow:hidden;
    background: linear-gradient(180deg, #eef7f1 0%, #e6f3ec 100%);
  }
  #map{
    width:100%;
    height:700px;
    display:block;
    cursor:grab;
  }
  .mapControls{
    display:flex;
    gap:10px;
    margin-top:15px;
    flex-wrap:wrap;
    align-items:center;
  }
  input{
    padding:10px;
    border-radius:10px;
    border:1px solid var(--line);
    font-weight:700;
    width:140px;
  }
  button{
    padding:10px 14px;
    border-radius:10px;
    border:none;
    background:var(--primary);
    color:#fff;
    font-weight:800;
    cursor:pointer;
  }
  button:hover{ background:var(--accent); }
  .hint{
    margin-top:10px;
    color:var(--muted);
    font-size:13px;
  }
</style>
</head>
<body>
<div class="container">

<nav class="navbar">
  <div class="brand">
    <div class="title">Kingdom 340</div>
    <div class="subtitle">Carte (cases + sens du jeu)</div>
  </div>
  <div class="navlinks">
    <a href="index.html">Accueil</a>
    <a href="classements.html">Classements</a>
    <a class="active" href="carte.html">Carte</a>
    <a href="planification.html">Planification</a>
    <a href="membres/index.html">Membres</a>
  </div>
</nav>

<h1 class="pageTitle">Carte 1200×1200</h1>
<p class="pageIntro">
0:0 est en bas • 597:597 = case château • Affichage tourné (comme le jeu).
</p>

<div class="mapControls">
  <input type="number" id="gotoX" placeholder="X (0-1199)" min="0" max="1199">
  <input type="number" id="gotoY" placeholder="Y (0-1199)" min="0" max="1199">
  <button type="button" onclick="goToCoord()">Aller à X:Y</button>
  <button type="button" onclick="goCenter()">Centrer 597:597</button>
  <button type="button" onclick="resetView()">Réinitialiser</button>
</div>

<div class="hint">
Molette = zoom (au pointeur) • Cliquer-glisser = déplacement • Survol = info
</div>

<div class="mapWrapper">
  <canvas id="map"></canvas>
</div>

<footer>
  <div>© Kingdom 340</div>
  <div class="muted">Données : data/map.csv</div>
</footer>

</div>

<script>
const canvas = document.getElementById("map");
const ctx = canvas.getContext("2d");

function resizeCanvas(){
  canvas.width = canvas.offsetWidth;
  canvas.height = 700;
}
resizeCanvas();
window.addEventListener("resize", () => { resizeCanvas(); draw(); });

const MAP_SIZE = 1200;
const CASTLE_X = 597;
const CASTLE_Y = 597;

// Taille d'une case (en pixels) à scale=1
const CELL = 8; // tu peux monter à 10/12 si tu veux plus "gros"

// Rotation visuelle (45° = losange)
const ROT = Math.PI / 4;

// Zoom + déplacement
let zoom = 1;
let panX = 0;
let panY = 0;
const MIN_ZOOM = 0.25;
const MAX_ZOOM = 12;

// Données
let players = [];

// Image château (posée sur la case 597:597)
const castleImg = new Image();
castleImg.src = "images/castle.png";
let castleReady = false;
castleImg.onload = ()=>{ castleReady = true; draw(); };

// --- CSV ---
function cleanNumber(value){
  return parseInt(
    (value ?? '').toString()
      .replace(/\u202f/g,' ')
      .replace(/\u00a0/g,' ')
      .replace(/\s/g,'')
      .replace(/,/g,'')
      .replace(/\./g,'')
  ) || 0;
}
function parseCSV(text){
  const lines = text.trim().split(/\r?\n/);
  const headers = lines[0].split(',').map(x => x.trim());
  return lines.slice(1).filter(l => l.trim().length > 0).map(line=>{
    const cols = line.split(',');
    const obj = {};
    headers.forEach((h,i)=> obj[h] = (cols[i] ?? '').trim());
    return obj;
  });
}
async function loadData(){
  try{
    const res = await fetch("data/map.csv", { cache:"no-store" });
    const text = await res.text();
    players = parseCSV(text).map(p => ({
      Pseudo: p.Pseudo || "",
      X: cleanNumber(p.X),
      Y: cleanNumber(p.Y),
      Alliance: p.Alliance || ""
    }));
  }catch(e){
    players = [];
  }
  draw();
}
loadData();

// --- Couleur alliance ---
function colorForAlliance(a){
  const colors = ["#1f3a5f","#3b82f6","#16a34a","#f97316","#a855f7","#ef4444","#0ea5e9","#64748b"];
  let hash = 0;
  for(let i=0;i<a.length;i++) hash = (hash*31 + a.charCodeAt(i)) >>> 0;
  return colors[hash % colors.length];
}

// ===============================
// Mapping coord -> écran (IMPORTANT)
// ===============================
// 0:0 est en bas => on inverse Y : Y_screen = (MAP_SIZE-1 - Y)
function worldToCanvasXY(x, y){
  const yy = (MAP_SIZE - 1) - y; // inversion Y
  return { wx: x, wy: yy };
}

// Puis conversion "case" -> pixels (avant rotation)
function worldToPixels(x, y){
  const w = worldToCanvasXY(x, y);
  return { px: w.wx * CELL, py: w.wy * CELL };
}

// ===============================
// Dessin avec rotation + pan + zoom
// ===============================
function beginView(){
  ctx.save();

  // Centre écran
  ctx.translate(canvas.width/2 + panX, canvas.height/2 + panY);

  // zoom
  ctx.scale(zoom, zoom);

  // rotation losange
  ctx.rotate(ROT);

  // On veut que le centre de la map (597:597) soit au centre
  const c = worldToPixels(CASTLE_X, CASTLE_Y);
  ctx.translate(-c.px, -c.py);
}

function endView(){
  ctx.restore();
}

// Grille légère (pas toute la map)
function drawGrid(){
  const step = 50; // en cases
  ctx.strokeStyle = "rgba(31,58,95,0.06)";
  ctx.lineWidth = 1 / zoom;

  // On dessine un carré autour du château (range)
  const range = 300; // cases autour
  const x0 = Math.max(0, CASTLE_X - range);
  const x1 = Math.min(MAP_SIZE, CASTLE_X + range);
  const y0 = Math.max(0, CASTLE_Y - range);
  const y1 = Math.min(MAP_SIZE, CASTLE_Y + range);

  // lignes verticales
  for(let x = x0; x <= x1; x += step){
    const a = worldToPixels(x, y0);
    const b = worldToPixels(x, y1);
    ctx.beginPath();
    ctx.moveTo(a.px, a.py);
    ctx.lineTo(b.px, b.py);
    ctx.stroke();
  }

  // lignes horizontales
  for(let y = y0; y <= y1; y += step){
    const a = worldToPixels(x0, y);
    const b = worldToPixels(x1, y);
    ctx.beginPath();
    ctx.moveTo(a.px, a.py);
    ctx.lineTo(b.px, b.py);
    ctx.stroke();
  }
}

function drawCastle(){
  const p = worldToPixels(CASTLE_X, CASTLE_Y);

  // La "case" du château (repère)
  ctx.strokeStyle = "rgba(239,68,68,0.35)";
  ctx.lineWidth = 2 / zoom;
  ctx.strokeRect(p.px, p.py, CELL, CELL);

  if(!castleReady) return;

  // On pose l'image dans la case (tu peux ajuster)
  const size = 140; // px à scale=1 (image)
  ctx.drawImage(castleImg, p.px - size/2 + CELL/2, p.py - size + CELL, size, size);
}

function drawPlayers(){
  const r = 4 / zoom; // taille fixe à l'écran (ne grossit pas)
  // Si tu veux que ça grossisse avec le zoom, remplace par: const r = 4;

  for(const pl of players){
    const p = worldToPixels(pl.X, pl.Y);

    ctx.fillStyle = pl.Alliance ? colorForAlliance(pl.Alliance) : "#1f3a5f";
    ctx.beginPath();
    ctx.arc(p.px + CELL/2, p.py + CELL/2, r, 0, Math.PI*2);
    ctx.fill();

    ctx.strokeStyle = "rgba(255,255,255,0.9)";
    ctx.lineWidth = 1 / zoom;
    ctx.stroke();
  }
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  beginView();
  drawGrid();
  drawCastle();
  drawPlayers();
  endView();
}

// ===============================
// Contrôles
// ===============================
function goCenter(){
  panX = 0; panY = 0;
  draw();
}
function resetView(){
  zoom = 1;
  panX = 0; panY = 0;
  draw();
}
function goToCoord(){
  const x = parseInt(document.getElementById("gotoX").value);
  const y = parseInt(document.getElementById("gotoY").value);
  if(!Number.isFinite(x) || !Number.isFinite(y)) return;

  // On calcule où est ce point à l'écran actuellement, puis on ajuste pan pour le centrer
  const pt = getScreenPositionOfWorld(x, y);
  const cx = canvas.width/2;
  const cy = canvas.height/2;
  panX += (cx - pt.sx);
  panY += (cy - pt.sy);
  draw();
}

// Aide: calcule la position écran d'une coordonnée (sans dessiner)
function getScreenPositionOfWorld(x, y){
  // On refait les mêmes transforms à l'envers (sans canvas state)
  // Étapes: centre écran + pan, zoom, rotation, translation centre (château)
  const c = worldToPixels(CASTLE_X, CASTLE_Y);
  const p = worldToPixels(x, y);

  // Position relative à l'origine "centrée sur château" en pixels monde
  let rx = p.px - c.px;
  let ry = p.py - c.py;

  // Rotation 45°
  const cos = Math.cos(ROT);
  const sin = Math.sin(ROT);
  const rrx = rx*cos - ry*sin;
  const rry = rx*sin + ry*cos;

  // Zoom
  const zrx = rrx * zoom;
  const zry = rry * zoom;

  // Centre + pan
  return {
    sx: canvas.width/2 + panX + zrx,
    sy: canvas.height/2 + panY + zry
  };
}

// Zoom au pointeur
canvas.addEventListener("wheel", (e)=>{
  e.preventDefault();

  const oldZoom = zoom;
  const factor = e.deltaY < 0 ? 1.15 : 0.85;
  const next = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, zoom * factor));
  if(next === zoom) return;

  // Position souris
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;

  // On veut garder le point sous la souris fixe => ajuster pan
  // On calcule le vecteur du centre vers la souris
  const vx = mx - (canvas.width/2 + panX);
  const vy = my - (canvas.height/2 + panY);

  // Après zoom, ce vecteur change proportionnellement
  const ratio = next / oldZoom;

  panX -= vx*(ratio - 1);
  panY -= vy*(ratio - 1);

  zoom = next;
  draw();
},{passive:false});

// Drag
let dragging=false;
let lastX=0,lastY=0;

canvas.addEventListener("mousedown", e=>{
  dragging=true;
  lastX=e.clientX;
  lastY=e.clientY;
  canvas.style.cursor="grabbing";
});
window.addEventListener("mouseup", ()=>{
  dragging=false;
  canvas.style.cursor="grab";
});
window.addEventListener("mousemove", e=>{
  if(!dragging) return;
  panX += (e.clientX - lastX);
  panY += (e.clientY - lastY);
  lastX = e.clientX;
  lastY = e.clientY;
  draw();
});

// Init
draw();
</script>
</body>
</html>
