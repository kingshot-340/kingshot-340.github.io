<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carte • Kingdom 340</title>
<link rel="stylesheet" href="css/styles.css">

<style>
.mapWrapper{
  margin-top:20px;
  border:1px solid var(--line);
  border-radius:14px;
  overflow:hidden;
  background:#e8f4ec;
}
#map{
  width:100%;
  height:700px;
  display:block;
  cursor:grab;
}
.mapControls{
  display:flex;
  gap:10px;
  margin-top:15px;
  flex-wrap:wrap;
}
input{
  padding:10px;
  border-radius:10px;
  border:1px solid var(--line);
  font-weight:700;
}
button{
  padding:10px 14px;
  border-radius:10px;
  border:none;
  background:var(--primary);
  color:#fff;
  font-weight:800;
  cursor:pointer;
}
button:hover{ background:var(--accent); }
.hint{
  margin-top:10px;
  color:var(--muted);
  font-size:13px;
}
</style>
</head>

<body>
<div class="container">

<nav class="navbar">
  <div class="brand">
    <div class="title">Kingdom 340</div>
    <div class="subtitle">Carte stratégique</div>
  </div>
  <div class="navlinks">
    <a href="index.html">Accueil</a>
    <a href="classements.html">Classements</a>
    <a class="active" href="carte.html">Carte</a>
    <a href="planification.html">Planification</a>
    <a href="membres/index.html">Membres</a>
  </div>
</nav>

<h1 class="pageTitle">Carte 1200×1200</h1>
<p class="pageIntro">
Centre château : <strong>597:597</strong>
</p>

<div class="mapControls">
  <button onclick="goCenter()">Centrer château</button>
  <button onclick="resetView()">Réinitialiser</button>
</div>

<div class="hint">
Molette = zoom • Cliquer-glisser = déplacement
</div>

<div class="mapWrapper">
  <canvas id="map"></canvas>
</div>

<footer>
  <div>© Kingdom 340</div>
  <div>Données : data/map.csv</div>
</footer>

</div>

<script>
const canvas = document.getElementById("map");
const ctx = canvas.getContext("2d");

function resizeCanvas(){
  canvas.width = canvas.offsetWidth;
  canvas.height = 700;
}
resizeCanvas();
window.addEventListener("resize", ()=>{resizeCanvas(); resetView();});

const MAP_SIZE = 1200;
const CASTLE_X = 597;
const CASTLE_Y = 597;

let scale = canvas.width / MAP_SIZE;
let offsetX = 0;
let offsetY = 0;

let players = [];

// ===== Chargement image château =====
const castleImg = new Image();
castleImg.src = "images/castle.png";

// ===== Nettoyage nombres =====
function cleanNumber(value){
  return parseInt((value||"").toString().replace(/\s/g,'')) || 0;
}

// ===== CSV =====
function parseCSV(text){
  const lines = text.trim().split(/\r?\n/);
  const headers = lines[0].split(',');
  return lines.slice(1).map(line=>{
    const cols = line.split(',');
    const obj = {};
    headers.forEach((h,i)=> obj[h.trim()] = (cols[i]||"").trim());
    return obj;
  });
}

async function loadData(){
  try{
    const res = await fetch('data/map.csv',{cache:'no-store'});
    const text = await res.text();
    players = parseCSV(text).map(p=>({
      Pseudo:p.Pseudo,
      X:cleanNumber(p.X),
      Y:cleanNumber(p.Y),
      Alliance:p.Alliance||""
    }));
  }catch(e){
    players=[];
  }
  draw();
}

// ===== DESSIN =====
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  drawGrid();
  drawCastle();
  drawPlayers();
}

function drawGrid(){
  ctx.strokeStyle="rgba(0,0,0,0.05)";
  ctx.lineWidth=1;
  for(let i=0;i<=MAP_SIZE;i+=100){
    ctx.beginPath();
    ctx.moveTo(i*scale+offsetX,offsetY);
    ctx.lineTo(i*scale+offsetX,MAP_SIZE*scale+offsetY);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(offsetX,i*scale+offsetY);
    ctx.lineTo(MAP_SIZE*scale+offsetX,i*scale+offsetY);
    ctx.stroke();
  }
}

function drawCastle(){
  if(!castleImg.complete) return;

  const size = 80 * scale;
  const x = CASTLE_X*scale + offsetX - size/2;
  const y = CASTLE_Y*scale + offsetY - size/2;

  ctx.drawImage(castleImg, x, y, size, size);
}

function drawPlayers(){
  players.forEach(p=>{
    const x = p.X*scale + offsetX;
    const y = p.Y*scale + offsetY;
    const r = 4 * scale;

    ctx.fillStyle = "#1f3a5f";
    ctx.beginPath();
    ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fill();
  });
}

// ===== CONTROLES =====
function goCenter(){
  offsetX = canvas.width/2 - CASTLE_X*scale;
  offsetY = canvas.height/2 - CASTLE_Y*scale;
  draw();
}
function resetView(){
  scale = canvas.width / MAP_SIZE;
  offsetX = 0;
  offsetY = 0;
  draw();
}

canvas.addEventListener("wheel",e=>{
  e.preventDefault();
  const factor = e.deltaY<0?1.15:0.85;
  scale *= factor;
  draw();
},{passive:false});

let dragging=false,lastX=0,lastY=0;
canvas.addEventListener("mousedown",e=>{
  dragging=true;
  lastX=e.clientX;
  lastY=e.clientY;
  canvas.style.cursor="grabbing";
});
window.addEventListener("mouseup",()=>{dragging=false;canvas.style.cursor="grab";});
window.addEventListener("mousemove",e=>{
  if(!dragging) return;
  offsetX += e.clientX-lastX;
  offsetY += e.clientY-lastY;
  lastX=e.clientX;
  lastY=e.clientY;
  draw();
});

loadData();
</script>
</body>
</html>
