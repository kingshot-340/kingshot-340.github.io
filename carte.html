<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carte • Kingdom 340</title>
<link rel="stylesheet" href="css/styles.css">

<style>
  .mapWrapper{
    margin-top:20px;
    border:1px solid var(--line);
    border-radius:14px;
    overflow:hidden;
    background: linear-gradient(180deg, #eef7f1 0%, #e6f3ec 100%);
  }
  #map{
    width:100%;
    height:700px;
    display:block;
    cursor:grab;
  }
  .mapControls{
    display:flex;
    gap:10px;
    margin-top:15px;
    flex-wrap:wrap;
    align-items:center;
  }
  input{
    padding:10px;
    border-radius:10px;
    border:1px solid var(--line);
    font-weight:700;
    width:140px;
  }
  button{
    padding:10px 14px;
    border-radius:10px;
    border:none;
    background:var(--primary);
    color:#fff;
    font-weight:800;
    cursor:pointer;
  }
  button:hover{ background:var(--accent); }
  .hint{
    margin-top:10px;
    color:var(--muted);
    font-size:13px;
  }
</style>
</head>

<body>
<div class="container">

<nav class="navbar">
  <div class="brand">
    <div class="title">Kingdom 340</div>
    <div class="subtitle">Carte stratégique (isométrique)</div>
  </div>
  <div class="navlinks">
    <a href="index.html">Accueil</a>
    <a href="classements.html">Classements</a>
    <a class="active" href="carte.html">Carte</a>
    <a href="planification.html">Planification</a>
    <a href="membres/index.html">Membres</a>
  </div>
</nav>

<h1 class="pageTitle">Carte 1200×1200</h1>
<p class="pageIntro">
Centre château : <strong>597:597</strong> (projection <strong>losange</strong> comme dans le jeu).
</p>

<div class="mapControls">
  <input type="number" id="gotoX" placeholder="X (0-1199)" min="0" max="1199">
  <input type="number" id="gotoY" placeholder="Y (0-1199)" min="0" max="1199">
  <button type="button" onclick="goToCoord()">Aller à X:Y</button>
  <button type="button" onclick="goCenter()">Centrer 597:597</button>
  <button type="button" onclick="resetView()">Réinitialiser</button>
</div>

<div class="hint">
Molette = zoom (au pointeur) • Cliquer-glisser = déplacement • Survol = info
</div>

<div class="mapWrapper">
  <canvas id="map"></canvas>
</div>

<footer>
  <div>© Kingdom 340</div>
  <div class="muted">Données : data/map.csv</div>
</footer>

</div>

<script>
  const canvas = document.getElementById("map");
  const ctx = canvas.getContext("2d");

  function resizeCanvas(){
    canvas.width = canvas.offsetWidth;
    canvas.height = 700;
  }
  resizeCanvas();
  window.addEventListener("resize", () => { resizeCanvas(); resetView(); });

  // -------------------------
  // CONFIG (à ajuster si besoin)
  // -------------------------
  const MAP_SIZE = 1200;
  const CENTER_X = 597;
  const CENTER_Y = 597;

  // Taille “tuile” à l’écran (en pixels) à l’échelle 1
  // Si tu trouves que ça ne colle pas au rendu, on ajuste ces 2 valeurs.
  const TILE_W_BASE = 34;   // largeur d’une tuile (losange)
  const TILE_H_BASE = 17;   // hauteur d’une tuile (souvent ~ moitié)

  // Image du château (ton fichier actuel)
  const CASTLE_SRC = "images/castle.png";

  // Taille du château à l’échelle 1 (en pixels) + ancrage (offset)
  // Le plus important : l’ancrage = point de contact au sol (la “base” du château).
  // On ancre l’image au “bas-centre” par défaut.
  const CASTLE_W_BASE = 260;
  const CASTLE_H_BASE = 260;

  // Ajustement fin de l’ancrage château (si 593:594 n’est pas exactement où tu veux)
  // Petite règle : modifie par pas de 2 ou 4.
  const CASTLE_ANCHOR_ADJUST_X = 0;   // + vers la droite
  const CASTLE_ANCHOR_ADJUST_Y = 10;  // + vers le bas

  // Points joueurs
  const DOT_R_BASE = 4; // rayon à l’échelle 1

  // -------------------------
  // VIEW (zoom + pan)
  // -------------------------
  let scale = 1;             // scale isométrique (multiplie TILE_W/H et tailles)
  let offsetX = 0;           // décalage écran (pixels)
  let offsetY = 0;

  const MIN_SCALE = 0.35;
  const MAX_SCALE = 6;

  // -------------------------
  // DATA
  // -------------------------
  let players = [];

  function cleanNumber(value){
    return parseInt(
      (value ?? '').toString()
        .replace(/\u202f/g,' ')
        .replace(/\u00a0/g,' ')
        .replace(/\s/g,'')
        .replace(/,/g,'')
        .replace(/\./g,'')
    ) || 0;
  }

  function parseCSV(text){
    const lines = text.trim().split(/\r?\n/);
    const headers = lines[0].split(',').map(x => x.trim());
    return lines.slice(1)
      .filter(l => l.trim().length > 0)
      .map(line => {
        const cols = line.split(',');
        const obj = {};
        headers.forEach((h,i) => obj[h] = (cols[i] ?? '').trim());
        return obj;
      });
  }

  async function loadData(){
    try{
      const res = await fetch('data/map.csv', { cache:'no-store' });
      const text = await res.text();
      players = parseCSV(text).map(p => ({
        Pseudo: p.Pseudo || "",
        X: cleanNumber(p.X),
        Y: cleanNumber(p.Y),
        Alliance: p.Alliance || ""
      }));
    }catch(e){
      players = [];
    }
    draw();
  }

  // -------------------------
  // COLORS
  // -------------------------
  function colorForAlliance(a){
    const colors = ["#1f3a5f","#3b82f6","#16a34a","#f97316","#a855f7","#ef4444","#0ea5e9","#64748b"];
    let hash = 0;
    for(let i=0;i<a.length;i++) hash = (hash*31 + a.charCodeAt(i)) >>> 0;
    return colors[hash % colors.length];
  }

  // -------------------------
  // ISO TRANSFORMS
  // -------------------------
  function tileW(){ return TILE_W_BASE * scale; }
  function tileH(){ return TILE_H_BASE * scale; }

  // Convertit coord monde (X,Y) -> pixel écran (sx, sy)
  function worldToScreen(x, y){
    const dx = x - CENTER_X;
    const dy = CENTER_Y - y; // <-- inversion de l'axe Y (très souvent le cas en map de jeu)

    const sx = (canvas.width/2) + offsetX + (dx - dy) * (tileW()/2);
    const sy = (canvas.height/2) + offsetY + (dx + dy) * (tileH()/2);

    return { sx, sy };
  }

  // Convertit pixel écran -> coord approx monde (X,Y)
  function screenToWorld(sx, sy){
    // On retire centre écran + offsets
    const rx = sx - (canvas.width/2) - offsetX;
    const ry = sy - (canvas.height/2) - offsetY;

    // Inversion du système :
    // rx = (dx - dy) * (tileW/2)
    // ry = (dx + dy) * (tileH/2)
    const a = rx / (tileW()/2);
    const b = ry / (tileH()/2);

    const dx = (a + b) / 2;
    const dy = (b - a) / 2;

    return {
      x: Math.round(CENTER_X + dx),
      y: Math.round(CENTER_Y + dy)
    };
  }

  // -------------------------
  // CASTLE IMAGE
  // -------------------------
  const castleImg = new Image();
  castleImg.src = CASTLE_SRC;
  let castleReady = false;
  castleImg.onload = () => { castleReady = true; draw(); };

  function drawCastle(){
    const { sx, sy } = worldToScreen(CENTER_X, CENTER_Y);

    if(!castleReady) {
      // fallback point
      ctx.fillStyle = "#ef4444";
      ctx.beginPath();
      ctx.arc(sx, sy, 6*scale, 0, Math.PI*2);
      ctx.fill();
      return;
    }

    const w = CASTLE_W_BASE * scale;
    const h = CASTLE_H_BASE * scale;

    // Ancrage bas-centre (base du château)
    const anchorX = sx + (CASTLE_ANCHOR_ADJUST_X * scale);
    const anchorY = sy + (CASTLE_ANCHOR_ADJUST_Y * scale);

    const drawX = anchorX - w/2;
    const drawY = anchorY - h;

    ctx.drawImage(castleImg, drawX, drawY, w, h);
  }

  // -------------------------
  // GRID (optionnel mais utile)
  // -------------------------
  function drawIsoGrid(){
    // On dessine une grille légère autour du centre, pas 1200x1200 (trop lourd)
    const range = 60; // nombre de cases autour du centre à afficher
    ctx.strokeStyle = "rgba(31,58,95,0.06)";
    ctx.lineWidth = 1;

    for(let i=-range;i<=range;i+=5){
      // lignes “diag 1” : (x+i, y-range) -> (x+i, y+range)
      let p1 = worldToScreen(CENTER_X + i, CENTER_Y - range);
      let p2 = worldToScreen(CENTER_X + i, CENTER_Y + range);
      ctx.beginPath();
      ctx.moveTo(p1.sx, p1.sy);
      ctx.lineTo(p2.sx, p2.sy);
      ctx.stroke();

      // lignes “diag 2” : (x-range, y+i) -> (x+range, y+i)
      p1 = worldToScreen(CENTER_X - range, CENTER_Y + i);
      p2 = worldToScreen(CENTER_X + range, CENTER_Y + i);
      ctx.beginPath();
      ctx.moveTo(p1.sx, p1.sy);
      ctx.lineTo(p2.sx, p2.sy);
      ctx.stroke();
    }
  }

  // -------------------------
  // PLAYERS
  // -------------------------
  function drawPlayers(){
    const r = DOT_R_BASE * scale;

    players.forEach(p=>{
      const { sx, sy } = worldToScreen(p.X, p.Y);

      ctx.fillStyle = p.Alliance ? colorForAlliance(p.Alliance) : "#1f3a5f";
      ctx.beginPath();
      ctx.arc(sx, sy, r, 0, Math.PI*2);
      ctx.fill();

      ctx.strokeStyle = "rgba(255,255,255,0.9)";
      ctx.lineWidth = Math.max(1, 1*scale);
      ctx.stroke();
    });
  }

  // -------------------------
  // DRAW
  // -------------------------
  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    drawIsoGrid();
    drawCastle();
    drawPlayers();
  }

  // -------------------------
  // CONTROLS
  // -------------------------
  function goCenter(){
    // Centre écran = centre monde
    offsetX = 0;
    offsetY = 0;
    draw();
  }

  function resetView(){
    scale = 1;
    offsetX = 0;
    offsetY = 0;
    draw();
  }

  function goToCoord(){
    const x = parseInt(document.getElementById("gotoX").value);
    const y = parseInt(document.getElementById("gotoY").value);
    if(!Number.isFinite(x) || !Number.isFinite(y)) return;

    // On veut que (x,y) arrive au centre écran -> on ajuste offsetX/Y
    const target = worldToScreen(x, y);
    const cx = canvas.width/2;
    const cy = canvas.height/2;

    offsetX += (cx - target.sx);
    offsetY += (cy - target.sy);

    draw();
  }

  // Zoom molette AU POINTEUR
  canvas.addEventListener("wheel", e=>{
    e.preventDefault();

    const oldScale = scale;
    const factor = e.deltaY < 0 ? 1.15 : 0.85;
    const nextScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, scale * factor));
    if(nextScale === scale) return;

    // coord monde sous souris avant zoom
    const mx = e.offsetX;
    const my = e.offsetY;
    const before = screenToWorld(mx, my);

    scale = nextScale;

    // coord écran de ce même monde après zoom
    const after = worldToScreen(before.x, before.y);

    // Ajuster offset pour que le pointeur reste sur le même monde
    offsetX += (mx - after.sx);
    offsetY += (my - after.sy);

    draw();
  }, { passive:false });

  // Pan (drag)
  let dragging=false;
  let lastX=0,lastY=0;

  canvas.addEventListener("mousedown", e=>{
    dragging=true;
    lastX=e.clientX;
    lastY=e.clientY;
    canvas.style.cursor="grabbing";
  });
  window.addEventListener("mouseup", ()=>{
    dragging=false;
    canvas.style.cursor="grab";
  });
  window.addEventListener("mousemove", e=>{
    if(!dragging) return;
    offsetX += (e.clientX - lastX);
    offsetY += (e.clientY - lastY);
    lastX = e.clientX;
    lastY = e.clientY;
    draw();
  });

  // Tooltip simple
  const tip = document.createElement("div");
  tip.style.position="fixed";
  tip.style.pointerEvents="none";
  tip.style.padding="8px 10px";
  tip.style.border="1px solid rgba(0,0,0,0.08)";
  tip.style.borderRadius="10px";
  tip.style.background="rgba(255,255,255,0.95)";
  tip.style.boxShadow="0 10px 30px rgba(17,24,39,.12)";
  tip.style.font="12px ui-sans-serif, system-ui";
  tip.style.color="#111827";
  tip.style.display="none";
  document.body.appendChild(tip);

  canvas.addEventListener("mousemove", (e) => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;

    // Cherche un joueur proche en pixels
    let found = null;
    const hit = 10;

    for(const p of players){
      const s = worldToScreen(p.X, p.Y);
      const dx = (s.sx - mx);
      const dy = (s.sy - my);
      if(dx*dx + dy*dy <= hit*hit){
        found = p;
        break;
      }
    }

    const w = screenToWorld(mx, my);

    tip.style.display = "block";
    tip.style.left = (e.clientX + 12) + "px";
    tip.style.top  = (e.clientY + 12) + "px";

    if(found){
      tip.innerHTML = `<strong>${found.Pseudo}</strong><br><span style="color:#6b7280">${found.Alliance || ""}</span> • ${found.X}:${found.Y}`;
    }else{
      tip.innerHTML = `<span style="color:#6b7280">Curseur :</span> ${w.x}:${w.y}`;
    }
  });

  canvas.addEventListener("mouseleave", () => tip.style.display="none");

  // Init
  loadData();
  draw();
</script>
</body>
</html>
